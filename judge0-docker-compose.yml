# Judge0 Docker Compose for CodeSaathi AI
# Self-hosted code execution sandbox
#
# Usage:
#   docker-compose -f judge0-docker-compose.yml up -d
#
# Judge0 will be available at http://localhost:2358
# Set JUDGE0_URL=http://localhost:2358 in your .env

version: "3.8"

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  judge0-server:
    image: judge0/judge0:1.13.1
    <<: *default-logging
    ports:
      - "2358:2358"
    privileged: true
    restart: unless-stopped
    environment:
      - REDIS_HOST=judge0-redis
      - POSTGRES_HOST=judge0-db
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      # Resource limits
      - CPU_TIME_LIMIT=5
      - CPU_EXTRA_TIME=2
      - WALL_TIME_LIMIT=10
      - MEMORY_LIMIT=128000
      - STACK_LIMIT=64000
      - MAX_PROCESSES_AND_OR_THREADS=60
      - MAX_FILE_SIZE=1024
      - ENABLE_NETWORK=false
      - NUMBER_OF_RUNS=1
      - ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
      - ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
    depends_on:
      - judge0-db
      - judge0-redis
    networks:
      - judge0-network

  judge0-workers:
    image: judge0/judge0:1.13.1
    <<: *default-logging
    command: ["./scripts/workers"]
    privileged: true
    restart: unless-stopped
    environment:
      - REDIS_HOST=judge0-redis
      - POSTGRES_HOST=judge0-db
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - CPU_TIME_LIMIT=5
      - CPU_EXTRA_TIME=2
      - WALL_TIME_LIMIT=10
      - MEMORY_LIMIT=128000
      - STACK_LIMIT=64000
      - MAX_PROCESSES_AND_OR_THREADS=60
      - MAX_FILE_SIZE=1024
      - ENABLE_NETWORK=false
      - NUMBER_OF_RUNS=1
      - ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
      - ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
    depends_on:
      - judge0-db
      - judge0-redis
    networks:
      - judge0-network

  judge0-db:
    image: postgres:16-alpine
    <<: *default-logging
    restart: unless-stopped
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data
    networks:
      - judge0-network

  judge0-redis:
    image: redis:7-alpine
    <<: *default-logging
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - judge0-redis-data:/data
    networks:
      - judge0-network

volumes:
  judge0-postgres-data:
  judge0-redis-data:

networks:
  judge0-network:
    driver: bridge
